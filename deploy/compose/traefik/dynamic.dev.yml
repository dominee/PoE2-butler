http:
  # Default Traefik→origin timeouts are too short when the dev mock scrapes Poe.ninja (browser 499, hung UI).
  serversTransports:
    poe2b-dev-long-read:
      forwardingTimeouts:
        dialTimeout: 30s
        responseHeaderTimeout: 900s
        idleConnTimeout: 900s

  routers:
    # Browser calls /api on the app host; do not send those through Vite — its http-proxy
    # still returns 499 on long OAuth callbacks and Poe.ninja mock scrapes (~30–90s+).
    app-api:
      rule: Host(`app.dev.hideoutbutler.com`) && PathPrefix(`/api`)
      entryPoints:
        - web
      service: api
      priority: 100
    app-docs:
      rule: Host(`app.dev.hideoutbutler.com`) && (Path(`/docs`) || Path(`/redoc`) || Path(`/openapi.json`))
      entryPoints:
        - web
      service: api
      priority: 50
    app:
      rule: Host(`app.dev.hideoutbutler.com`)
      entryPoints:
        - web
      service: app
      priority: 1
    api:
      rule: Host(`api.dev.hideoutbutler.com`)
      entryPoints:
        - web
      service: api
    admin:
      rule: Host(`admin.dev.hideoutbutler.com`)
      entryPoints:
        - web
      service: admin
    mockggg:
      rule: Host(`ggg.dev.hideoutbutler.com`)
      entryPoints:
        - web
      service: mockggg

  services:
    app:
      loadBalancer:
        serversTransport: poe2b-dev-long-read
        servers:
          - url: http://frontend:5173
    api:
      loadBalancer:
        serversTransport: poe2b-dev-long-read
        servers:
          - url: http://backend:8000
    admin:
      loadBalancer:
        servers:
          - url: http://admin:8001
    mockggg:
      loadBalancer:
        servers:
          - url: http://mock-ggg:9000
