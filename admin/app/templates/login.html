{% extends "base.html" %}
{% block title %}Sign in · Admin{% endblock %}
{% block content %}
<div class="panel form-card">
  <div class="login-hero">
    <h2>Operator sign-in</h2>
    <p class="muted">Restricted access. Use strong credentials and TOTP in production.</p>
  </div>
  {% if error %}<div class="error-banner" role="alert">{{ error }}</div>{% endif %}
  <!-- nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -->
  <form method="post" action="/admin/login" class="stack">
    {% if csrf_token %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    {% endif %}
    <label>
      Username
      <input name="username" autocomplete="username" required autofocus />
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    {% if requires_totp %}
    <label>
      TOTP code
      <input name="totp" inputmode="numeric" pattern="[0-9]{6}" required />
    </label>
    {% endif %}
    <button type="submit" class="primary">Sign in</button>
  </form>
</div>
{% endblock %}
